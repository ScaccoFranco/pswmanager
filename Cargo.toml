[workspace]
resolver = "2"
members = ["crates/pwdv-core", "crates/pwdv-cli", "crates/pwdv-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
pwdv-core = { path = "crates/pwdv-core" }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
# Già presente tramite egui-winit. `wayland-data-control` serve: su Hyprland
# il clipboard X11 di XWayland non arriva alle applicazioni Wayland. Il
# contenuto è servito da un thread di pwdv e sparisce quando pwdv termina.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# `persistence` NON va abilitata: nessuno stato egui deve finire su disco.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
